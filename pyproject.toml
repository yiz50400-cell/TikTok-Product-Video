[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiktok-product-video"
dynamic = ["version"]
description = "Local-material Codex + ChatCut + Remotion product video workflow with batch editing, narration, captions and delivery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11.3,<13",
  "PyYAML>=6.0.2,<7",
  "fastapi>=0.115,<0.130",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "imageio-ffmpeg>=0.6,<1",
  "edge-tts>=7.2,<8",
  "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
kokoro = [
  "kokoro>=0.9.4,<1",
  "soundfile>=0.12",
  "numpy>=1.26",
]
edge-tts = [
  "edge-tts>=7,<8",
]

[project.scripts]
tk-ops-workspace = "tk_ops_workspace.cli:main"
product-video-workflow = "workflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--ignore=tests/test_repair.py --ignore=tests/test_repair_device.py"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".tmp",
  ".codex-*",
  "**/.codex-*/**",
  "domains/tk_ad_agent/.tmp",
  "domains/tk_report_agent/.tmp",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^v?(?P<version>[0-9][^\\s]*)"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_ops_workspace", "workflow", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"workflow/**/*.py" = ["E701", "E702", "E731"]
"scripts/*.py" = ["E701", "E702", "E731", "E402"]
"tests/*.py" = ["E701", "E702", "E731", "E402"]
