[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiktok-product-video"
dynamic = ["version"]
description = "Windows-first TikTok Shop product video editing workspace: FFmpeg render, voiceover/subtitles, compliance checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11.3,<13",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
kokoro = [
  "kokoro>=0.9.4,<1",
  "soundfile>=0.12",
  "numpy>=1.26",
]
edge-tts = [
  "edge-tts>=7,<8",
]

[project.scripts]
tk-ops-workspace = "tk_ops_workspace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".tmp",
  ".codex-*",
  "**/.codex-*/**",
  "domains/tk_ad_agent/.tmp",
  "domains/tk_report_agent/.tmp",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^v?(?P<version>[0-9][^\\s]*)"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_ops_workspace"]
