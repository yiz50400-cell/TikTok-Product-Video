video_editor:
  default_market: ""
  output_root: "outputs/video"
  require_chinese_script_approval: true
  prefer_vertical_9x16: true
  render_preview_first: true
  final_video_codec: "h264"
  final_audio_codec: "aac"
  downloader: "yt-dlp"
  tts_provider: "local_kokoro_if_available"  # voiceover --backend auto: kokoro -> edge-tts; silent = test only
  tts_max_tempo: 1.25
  default_delivery: "clean_mp4_plus_srt"  # burn subtitles only on request (-BurnSubtitles)
  voiceover_example: "config/voiceover.example.json"
  notes: "No secrets here. Employee may set default_market to Mexico, Brazil, Indonesia, or leave blank."
