# 描述性客户偏好；脚本不读取这些键。实际运行使用 CLI 参数与 ChatCut 项目设置。
# 本地配置不存在时再复制，保留已有配置；不要填写密钥。
video_editor:
  default_market: "" # MX | BR | ID | PH；空值由本次任务确定
  output_root: "outputs/video"
  material_source: "customer_local_files"
  desktop_editor: "chatcut"
  packaging_engine: "remotion"
  workflow: "chatcut_export_then_remotion_package"
  interactive_refinement: false
  prefer_vertical_9x16: true
  background_music: false
  audio_mode: "narration_or_silent"
  final_video_codec: "h264"
  final_audio_codec: "aac"
  tts_provider: "configured_local_or_edge_tts"
  default_delivery: "packaged_mp4_plus_srt"
  fontfile: ""
